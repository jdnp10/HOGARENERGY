<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Asesoría Energética

</title>

<link rel="stylesheet" href="css/asesoria.css">
</head>

<body>

<header class="header">

<div class="logo">

🏠 HogarEnergy

</div>

<nav>

<ul>

<li>

<a href="index.html">

Inicio

</a>

</li>

</ul>

</nav>

</header>

<section class="hero">

<h1>

Solicitar Asesoría

</h1>

<p>

Nuestros especialistas evaluarán el consumo energético de su vivienda o empresa.

</p>

</section>

<section class="formularioPublicidad">

<h2>

Formulario de Asesoría

</h2>

<form id="formAsesoria">

<label>

Nombre Completo

</label>

<input
type="text"
id="nombre"
required>

<label>

Celular

</label>

<input
type="text"
id="celular"
required>

<label>

Correo

</label>

<input
type="email"
id="correo"
required>

<label>

Ciudad

</label>

<input
type="text"
id="ciudad"
required>

<label>

Tipo de inmueble

</label>

<select id="tipo">

<option>

Vivienda

</option>

<option>

Empresa

</option>

<option>

Local Comercial

</option>

<option>

Institución

</option>

</select>

<label>

Describa brevemente su necesidad

</label>

<textarea

id="descripcion"

rows="6"

placeholder="Cuéntenos qué desea mejorar o analizar en cuanto al consumo de energía."

></textarea>

<br><br>

<button

type="submit"

class="btn">

Solicitar Asesoría

</button>

</form>

</section>

<script src="js/asesoria.js"></script>

</body>

</html>
